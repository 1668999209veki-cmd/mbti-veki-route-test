<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MBTI选择 · 方案预览</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1020;color:#e5ecfa;font:14px system-ui;padding:24px 16px}h1{font-size:23px;color:#f4e8bb;margin:10px 0 24px}.panel{background:#1b2540;border:1px solid #3b4967;border-radius:18px;padding:18px;position:relative}h2{font-size:17px;margin:0 0 16px}.field{width:100%;height:48px;background:#111c30;color:#dce7f8;border:1px solid #62789e;border-radius:12px;text-align:left;padding:0 14px;font-size:15px;display:flex;justify-content:space-between;align-items:center}.menu{position:absolute;top:calc(100% - 10px);left:18px;right:18px;z-index:5;margin-top:0;background:#202d49;border:1px solid #617899;border-radius:16px;padding:12px;box-shadow:0 15px 30px #0005}.tabs{display:flex;gap:5px;background:#121e35;padding:4px;border-radius:10px;margin-bottom:12px}.tabs button{flex:1;background:none;color:#a6b5ce;border:0;border-radius:7px;height:36px;font:600 14px system-ui}.tabs button.active{background:#3a527a;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{background:#17233c;border:1px solid #455778;border-radius:10px;min-height:49px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:#ecf2ff;font-size:13px;cursor:pointer}.item strong{font-size:15px}.item span{color:#aebed7;font-size:11px}.item.selected{background:#314f78;border-color:#8cb6f5}.hint{text-align:center;color:#9cabca;font-size:11px;margin:12px 0 0}.sub{margin-top:20px;opacity:.7}.placeholder{display:flex;gap:9px}.placeholder div{flex:1;background:#dfe6ef;color:#31425b;height:110px;display:grid;place-items:center;border-radius:12px}.note{color:#8f9fba;font-size:12px;line-height:1.6;margin:20px 4px}button{cursor:pointer}button:focus-visible{outline:2px solid #f0d47c}</style><h1>制作你的 MBTI 纪念海报</h1><section class="panel"><h2>选择你的人格类型</h2><button class="field" id="trigger" aria-expanded="true"><span id="chosen">请选择 MBTI 类型</span><span id="arrow">⌃</span></button><div class="menu" id="menu"><div class="tabs"><button id="tabI" class="active">I 开头 · 8种</button><button id="tabE">E 开头 · 8种</button></div><div class="grid" id="grid"></div><p class="hint">先选首字母，再点选人格类型</p></div></section><section class="panel sub"><h2>制作你的专属形象</h2><div class="placeholder"><div>👾 像素风</div><div>🐱 Q版卡通</div><div>🎨 扁平插画</div></div></section><p class="note">交互原型 · 未应用到正式页面<br>点选后收起浮层，只显示当前人格。</p><script>const groups={I:[['INTJ','建筑师'],['INTP','逻辑学家'],['INFJ','提倡者'],['INFP','调停者'],['ISTJ','检查员'],['ISTP','鉴赏家'],['ISFJ','守卫者'],['ISFP','探险家']],E:[['ENTJ','指挥官'],['ENTP','辩论家'],['ENFJ','主人公'],['ENFP','竞选者'],['ESTJ','总经理'],['ESTP','企业家'],['ESFJ','执政官'],['ESFP','表演者']]};let selected='';const menu=document.getElementById('menu'),trigger=document.getElementById('trigger');function toggle(open){menu.hidden=!open;trigger.setAttribute('aria-expanded',open);document.getElementById('arrow').textContent=open?'⌃':'⌄'}function render(g){for(const k of ['I','E'])document.getElementById('tab'+k).classList.toggle('active',k===g);document.getElementById('grid').innerHTML='';for(const [code,name]of groups[g]){let b=document.createElement('button');b.className='item'+(selected===code?' selected':'');b.innerHTML='<strong>'+code+'</strong><span>'+name+'</span>';b.onclick=()=>{selected=code;document.getElementById('chosen').textContent=code+' · '+name;toggle(false)};document.getElementById('grid').append(b)}}trigger.onclick=()=>toggle(menu.hidden);document.getElementById('tabI').onclick=()=>render('I');document.getElementById('tabE').onclick=()=>render('E');render('I');</script></html>
